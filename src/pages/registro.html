<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Lácteos Bonanza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <form id="registro-form" class="card shadow border-0">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-4 text-center">Crear cuenta</h1>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input id="nombre" class="form-control" autocomplete="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo</label>
                            <input id="email" class="form-control" type="email" autocomplete="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input id="password" class="form-control" type="password" minlength="6" autocomplete="new-password" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirmar" class="form-label">Confirmar contraseña</label>
                            <input id="confirmar" class="form-control" type="password" minlength="6" autocomplete="new-password" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Crear cuenta</button>
                        <div id="mensaje" class="mt-3" aria-live="polite"></div>
                        <p class="mt-3 mb-0 text-center">¿Ya tienes cuenta? <a href="./login.html">Iniciar sesión</a></p>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script type="module" src="../js/auth/registro.js"></script>
</body>
</html>
