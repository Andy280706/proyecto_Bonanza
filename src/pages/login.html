<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">
    <main class="auth-page">
        <form id="login-form" class="auth-card">
            <h1>Iniciar sesión</h1>
            <label>Correo<input id="email" type="email" required></label>
            <label>Contraseña<input id="password" type="password" required></label>
            <button class="btn" type="submit">Ingresar</button>
            <div id="mensaje"></div>
            <p>¿No tienes cuenta? <a href="./registro.html">Registrarte</a></p>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/auth/login.js"></script>
</body>
</html>
